<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Facilito POS - Sistema de Facturación y Control" />
    <link rel="icon" type="image/png" href="/pwa-splash-logo-192.png" />
    <link rel="manifest" href="/manifest.json?v=4" />
    <title>Facilito POS Pro</title>
    <style>
      #app-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justifyContent: center;
        z-index: 99999999;
        transition: opacity 0.4s ease-out;
      }
      #app-splash img {
        width: 220px;
        height: 220px;
        object-fit: contain;
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #ffffff;">
    <!-- Splash Screen Instantáneo con Texto Completo -->
    <div id="app-splash">
      <img src="/pwa-splash-logo-512.png" alt="Facilito POS" />
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const splash = document.getElementById('app-splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 400);
          }
        }, 500);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
