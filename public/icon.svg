      <circle cx="120" cy="148" r="12" fill="#ffffff"/>
      <circle cx="45" cy="185" r="12" fill="#ffffff"/>
      <circle cx="83" cy="185" r="12" fill="#ffffff"/>
      <circle cx="120" cy="185" r="12" fill="#ffffff"/>
      <circle cx="45" cy="222" r="12" fill="#00b050"/>
