<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo Solido Premium para Android -->
  <rect width="512" height="512" rx="115" fill="#0a1d37"/>
  
  <g transform="translate(68, 60) scale(0.72)">
    <!-- Nube Tecnológica Superior -->
    <path d="M 180 140 C 130 140 90 180 90 230 C 90 235 91 240 93 245 C 60 255 35 285 35 325 C 35 375 75 415 125 415 L 260 415 L 260 140 Z" fill="#00b050"/>
    <path d="M 260 140 L 260 415 L 395 415 C 445 415 485 375 485 325 C 485 285 460 255 427 245 C 429 240 430 235 430 230 C 430 180 390 140 340 140 C 315 140 292 150 275 168 C 258 150 235 140 180 140 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Circuitos en la Nube -->
    <circle cx="170" cy="280" r="14" fill="#ffffff"/>
    <path d="M 170 294 L 170 415 L 140 455" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="230" cy="225" r="14" fill="#ffffff"/>
    <path d="M 230 239 L 230 415 L 185 475" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="310" cy="275" r="14" fill="#0a1d37"/>
    <path d="M 310 289 L 310 415 L 265 475" stroke="#0a1d37" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Bucle Infinito Exterior Blanco/Cian Claro -->
    <path d="M 160 430 C 60 430 5 500 5 580 C 5 660 60 730 160 730 C 240 730 300 680 340 620 C 380 680 440 730 520 730 C 620 730 675 660 675 580 C 675 500 620 430 520 430 C 440 430 380 480 340 540 C 300 480 240 430 160 430 Z" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bucle Infinito Interior Verde Neón Esmeralda -->
    <path d="M 160 470 C 85 470 45 520 45 580 C 45 640 85 690 160 690 C 220 690 270 650 310 595 L 370 510 C 410 455 460 470 520 470 C 595 470 635 520 635 580 C 635 640 595 690 520 690 C 460 690 410 650 370 595" fill="none" stroke="#00b050" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- POS Terminal (Izquierda) -->
    <g transform="translate(90, 500) rotate(-16)">
      <rect x="0" y="0" width="85" height="135" rx="18" fill="#ffffff"/>
      <rect x="10" y="10" width="65" height="48" rx="8" fill="#0a1d37"/>
      <!-- Check en pantallita -->
      <path d="M 24 34 L 36 45 L 60 22" fill="none" stroke="#00b050" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Botones -->
      <circle cx="23" cy="76" r="6" fill="#0a1d37"/>
      <circle cx="43" cy="76" r="6" fill="#0a1d37"/>
      <circle cx="63" cy="76" r="6" fill="#0a1d37"/>
      <circle cx="23" cy="96" r="6" fill="#0a1d37"/>
      <circle cx="43" cy="96" r="6" fill="#0a1d37"/>
      <circle cx="63" cy="96" r="6" fill="#0a1d37"/>
      <circle cx="23" cy="116" r="6" fill="#00b050"/>
      <circle cx="43" cy="116" r="6" fill="#00b050"/>
      <circle cx="63" cy="116" r="6" fill="#00b050"/>
    </g>
    
    <!-- Checkmark Grande (Derecha) -->
    <path d="M 455 570 L 505 620 L 595 510" fill="none" stroke="#00b050" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
